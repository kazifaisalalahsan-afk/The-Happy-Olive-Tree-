<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17352c">
<title>Happy Olive Tree — Bread Orders</title>
<style>
:root{
  --bg:#f3f5ef;--surface:#ffffff;--surface-2:#eef2ea;--text:#1d2923;--muted:#738079;
  --line:#dce3dc;--green:#173f32;--green-2:#2d5a46;--green-soft:#e6efe8;
  --cream:#faf8f1;--red:#a43d34;--red-soft:#fbedeb;--amber:#8a641f;--amber-soft:#f5efe2;
  --shadow-sm:0 2px 10px rgba(24,48,39,.06);--shadow:0 12px 34px rgba(24,48,39,.10);
  --r-sm:12px;--r-md:18px;--r-lg:24px;--r-xl:30px
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(45,90,70,.18);outline-offset:2px}
.hidden{display:none!important}.center{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 6%,#e6ecdf 0,transparent 28%),linear-gradient(180deg,#f7f8f4,var(--bg))}
h1,h2,h3,p{margin:0}.brand{font-size:.69rem;font-weight:900;letter-spacing:.16em;color:#78845f}.muted{color:var(--muted);font-size:.84rem}
.card{background:var(--surface);border:1px solid rgba(31,59,47,.08);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-sm)}
.auth{width:min(430px,100%);display:grid;gap:14px;padding:28px;border-radius:var(--r-xl);box-shadow:var(--shadow)}
.auth:before{content:"";width:52px;height:52px;border-radius:18px;display:block;background:linear-gradient(145deg,var(--green),var(--green-2));box-shadow:0 10px 24px rgba(23,63,50,.22);margin-bottom:4px}
.auth h1{font-size:2.35rem;line-height:1;letter-spacing:-.045em}.auth .muted{font-size:.98rem}
input,select,textarea{width:100%;min-height:50px;border:1px solid #cfd8d1;background:#fff;border-radius:14px;padding:12px 14px;color:var(--text);transition:border-color .18s,box-shadow .18s,background .18s}
input::placeholder,textarea::placeholder{color:#9aa49e}
input:focus,select:focus,textarea:focus{border-color:#7e9a8a;box-shadow:0 0 0 4px rgba(45,90,70,.08);background:#fff;outline:none}
textarea{min-height:92px;resize:vertical}
.primary,.secondary{min-height:44px;border-radius:13px;padding:10px 14px;font-weight:800;transition:transform .12s,box-shadow .12s,background .12s}
.primary{border:1px solid var(--green);background:var(--green);color:#fff;box-shadow:0 6px 14px rgba(23,63,50,.12)}
.primary:active,.secondary:active{transform:translateY(1px)}
.secondary{border:1px solid var(--line);background:#fff;color:var(--text)}
.secondary:hover{background:#f8faf7}.danger{color:var(--red)}
.shell{max-width:760px;margin:auto;padding-bottom:calc(102px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:calc(14px + env(safe-area-inset-top)) 18px 12px;background:rgba(243,245,239,.91);backdrop-filter:blur(18px);border-bottom:1px solid rgba(31,59,47,.06)}
.top h1{font-size:1.85rem;line-height:1.05;letter-spacing:-.04em}.top-title{min-width:0}.top-actions{display:flex;align-items:center;gap:8px}.role-chip{padding:7px 10px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.top .secondary{min-height:40px;padding:8px 11px;background:rgba(255,255,255,.82)}
.view{padding:14px 16px 30px}
.hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#163d31 0%,#24513f 100%);color:#fff;border-radius:var(--r-lg);padding:20px;margin-bottom:16px;box-shadow:0 14px 30px rgba(23,63,50,.16)}
.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;top:-90px;background:rgba(255,255,255,.055)}
.hero h2{font-size:1.45rem;letter-spacing:-.02em}.hero p{max-width:560px}.metrics{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.metric{background:rgba(255,255,255,.105);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;min-height:76px;display:flex;flex-direction:column;justify-content:center}
.metric strong{display:block;font-size:1.62rem;line-height:1;margin-bottom:5px}.quick{position:relative;z-index:1;display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero .secondary{background:rgba(255,255,255,.96);border-color:transparent}
.stack{display:grid;gap:10px}.section{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}.section h2{font-size:1.18rem;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:7px;flex-wrap:wrap}
.order,.item,.customer,.staff-card{display:grid;gap:11px}
.order{padding:16px 16px 14px;border-left:4px solid #91a997}.order-overdue{border-left-color:#ca7168;background:linear-gradient(90deg,#fff9f8 0,#fff 35%)}
.order-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.order-name{font-size:1.02rem;font-weight:850;letter-spacing:-.01em}.meta-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px;color:var(--muted);font-size:.8rem}.phone-link{color:var(--green);text-decoration:none;font-weight:700}
.product-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.product-copy{display:grid;gap:2px}.product-brand{font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#7b887f}.product-name{font-weight:850}.qty-bubble{min-width:44px;height:44px;border-radius:15px;background:var(--surface-2);display:grid;place-items:center;font-weight:900;font-size:1.02rem}
.card-actions{display:grid;grid-template-columns:1fr 1.2fr;gap:8px}
.line{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:9px}
.badge{display:inline-flex;align-items:center;white-space:nowrap;font-size:.66rem;line-height:1;font-weight:900;letter-spacing:.035em;background:var(--surface-2);padding:6px 8px;border-radius:999px;color:#536059}.badge.red{background:var(--red-soft);color:var(--red)}.badge.off{background:var(--amber-soft);color:var(--amber)}.badge.green{background:var(--green-soft);color:var(--green)}
.item-title,.customer-title{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.customer-meta{display:grid;gap:3px}.customer-notes{font-size:.84rem;line-height:1.45}.regular-box{background:var(--surface-2);border-radius:14px;padding:11px 12px;font-size:.82rem;line-height:1.4}.staff-card{padding:16px}.role-pill{text-transform:uppercase;font-weight:800;letter-spacing:.03em}.access-help{line-height:1.5}.notice{background:var(--surface-2);border:1px solid rgba(31,59,47,.06);border-radius:16px;padding:13px 14px;font-size:.86rem;line-height:1.5}
.brand-group{display:grid;gap:8px;margin:18px 0 24px}.brand-head{display:flex;justify-content:space-between;align-items:center;padding:0 3px}.brand-head h3{font-size:1rem;letter-spacing:-.01em}.field-label{font-size:.72rem;font-weight:900;letter-spacing:.045em;text-transform:uppercase;color:#6d7972;margin:4px 2px -3px}.search{margin-bottom:14px;background:#fff}
.checkrow{display:flex;align-items:center;gap:10px;min-height:44px}.checkrow input{width:20px;height:20px;min-height:0;accent-color:var(--green)}
.empty{text-align:center;padding:30px 18px;color:var(--muted)}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:12;width:min(760px,100%);display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(18px);border-top:1px solid rgba(31,59,47,.08);box-shadow:0 -12px 30px rgba(27,50,41,.07)}
.nav button{border:0;background:transparent;color:#77847d;min-height:58px;padding:6px 3px;border-radius:15px;font-size:.65rem;font-weight:750;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nav button.active{background:var(--green-soft);color:var(--green);font-weight:900}.nav-icon{width:19px;height:19px;display:block}.nav-icon svg{width:100%;height:100%;stroke:currentColor}
.fab{position:fixed;right:max(18px,calc((100vw - 760px)/2 + 18px));bottom:calc(88px + env(safe-area-inset-bottom));width:60px;height:60px;border:0;border-radius:21px;background:linear-gradient(145deg,var(--green),var(--green-2));color:#fff;font-size:1.9rem;line-height:1;z-index:13;box-shadow:0 12px 28px rgba(23,63,50,.28)}
.modal{position:fixed;inset:0;background:rgba(17,28,23,.48);display:grid;place-items:end center;z-index:30;backdrop-filter:blur(2px)}
.sheet{position:relative;width:min(760px,100%);background:#fbfcf9;border-radius:28px 28px 0 0;padding:28px 18px calc(28px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;box-shadow:0 -18px 48px rgba(20,42,33,.18)}
.sheet:before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:44px;height:5px;border-radius:99px;background:#d1d9d2}.sheet h2{font-size:1.35rem;letter-spacing:-.025em}
.form{display:grid;gap:11px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:15px}.seg .secondary{border-color:transparent;background:transparent}.seg button.active{background:#fff;color:var(--green);box-shadow:var(--shadow-sm)}
@media(max-width:520px){
  .center{padding:16px}.auth{padding:22px}.auth h1{font-size:2.05rem}.top{padding-left:16px;padding-right:16px}.top h1{font-size:1.65rem}.role-chip{display:none}
  .view{padding:12px 12px 24px}.hero{padding:17px;border-radius:22px}.metrics{gap:7px}.metric{padding:10px 8px;min-height:70px}.metric strong{font-size:1.45rem}
  .two{grid-template-columns:1fr}.row{align-items:flex-start}.actions{gap:6px}.order-head{gap:8px}.card-actions{grid-template-columns:1fr 1fr}.nav{padding-left:5px;padding-right:5px}.nav button{font-size:.60rem;min-height:56px}.nav-icon{width:18px;height:18px}
}
@media(min-width:761px){.fab{right:calc((100vw - 760px)/2 + 18px)}}
</style>
</head>
<body>
<div id="auth" class="center">
  <form id="authForm" class="card auth">
    <div class="brand">THE HAPPY OLIVE TREE</div>
    <h1>Bread Orders</h1>
    <p id="authHelp" class="muted">Sign in with your staff account.</p>
    <input id="displayName" class="hidden" placeholder="Your name">
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" minlength="6" required>
    <div id="authErr" class="muted danger"></div>
    <button id="resendConfirm" type="button" class="secondary hidden">Resend confirmation email</button>
    <button id="authSubmit" class="primary">Sign in</button>
    <button id="authToggle" type="button" class="secondary">Create account</button>
  </form>
</div>
<div id="app" class="shell hidden">
  <header class="top"><div class="top-title"><div class="brand">THE HAPPY OLIVE TREE</div><h1 id="title">Today</h1></div><div class="top-actions"><span id="roleChip" class="role-chip">Staff</span><button id="signout" class="secondary">Sign out</button></div></header>
  <main id="view" class="view"></main>
  <button id="fab" class="fab" aria-label="Add">+</button>
  <nav class="nav" aria-label="Primary">
    <button data-route="today" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span><span>Today</span></button>
    <button data-route="upcoming"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span>Upcoming</span></button>
    <button data-route="regular"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 013-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 01-3 3H3"/></svg></span><span>Regular</span></button>
    <button data-route="customers"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><circle cx="9" cy="8" r="3"/><path d="M3.5 19a5.5 5.5 0 0111 0"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.5a4.6 4.6 0 015 4.5"/></svg></span><span>Customers</span></button>
    <button data-route="items"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></span><span>Items</span></button>
    <button id="staffNav" data-route="staff" class="hidden"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><path d="M12 3l7 3v5c0 4.6-2.8 8.1-7 10-4.2-1.9-7-5.4-7-10V6l7-3z"/><path d="M9.5 12l1.7 1.7 3.7-4"/></svg></span><span>Staff</span></button>
  </nav>
</div>
<div id="modal" class="modal hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://encmdeinctvjhdiedjfu.supabase.co';
const SUPABASE_KEY='sb_publishable_jwlX0Y-7M_D0CHZEzwbrow_E8yJ07oT';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
let session=null,profile=null,storeId=null,orders=[],items=[],customers=[],staffAccess=[],route='today',customerSearch='';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function d(off=0){let x=new Date();x.setDate(x.getDate()+off);return new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Melbourne',year:'numeric',month:'2-digit',day:'2-digit'}).format(x)}
function nice(s){let [y,m,x]=s.split('-').map(Number);return new Intl.DateTimeFormat('en-AU',{weekday:'short',day:'numeric',month:'short'}).format(new Date(Date.UTC(y,m-1,x,12)))}
function add7(s){let x=new Date(s+'T12:00:00Z');x.setUTCDate(x.getUTCDate()+7);return x.toISOString().slice(0,10)}
function activeOrders(){return orders.filter(o=>!['collected','cancelled'].includes(o.status))}
function activeItems(){return items.filter(i=>i.active)}
function activeCustomers(){return customers.filter(c=>c.active!==false)}
function brands(activeOnly=false){const src=activeOnly?activeItems():items;return [...new Set(src.map(i=>i.brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}
function itemsForBrand(brand,activeOnly=false){const src=activeOnly?activeItems():items;return src.filter(i=>i.brand===brand).sort((a,b)=>a.name.localeCompare(b.name))}
function canManage(){return profile&&['admin','manager'].includes(profile.role)}
async function refresh(){
  const [or,ir,cr]=await Promise.all([
    sb.from('bread_orders_simple').select('*').eq('store_id',storeId).order('order_date'),
    sb.from('bread_items').select('*').eq('store_id',storeId).order('brand').order('name'),
    sb.from('customers').select('*').eq('store_id',storeId).order('name')
  ]);
  if(or.error)return alert(or.error.message);if(ir.error)return alert(ir.error.message);if(cr.error)return alert(cr.error.message);
  orders=or.data||[];items=ir.data||[];customers=cr.data||[];
  if(profile?.role==='admin'){
    const sr=await sb.rpc('list_staff_access');
    if(sr.error)return alert(sr.error.message);
    staffAccess=sr.data||[];
  }else staffAccess=[];
  render();
}
function orderCard(o){
  let overdue=o.order_date<d()&&!['collected','cancelled'].includes(o.status);
  const phone=o.phone?'<a class="phone-link" href="tel:'+esc(String(o.phone).replace(/\\s/g,''))+'">'+esc(o.phone)+'</a>':'<span>No phone</span>';
  return `<article class="card order ${overdue?'order-overdue':''}"><div class="order-head"><div><div class="order-name">${esc(o.customer_name)}</div><div class="meta-row"><span>${nice(o.order_date)}</span><span>•</span>${phone}</div></div><span class="badge ${overdue?'red':''}">${overdue?'OVERDUE':o.status.toUpperCase()}</span></div><div class="product-row"><div class="product-copy"><span class="product-brand">${esc(o.brand)}</span><span class="product-name">${esc(o.bread_type)}</span></div><div class="qty-bubble">×${o.quantity}</div></div><div class="card-actions"><button class="secondary" data-ready="${o.id}">Ready</button><button class="primary" data-collected="${o.id}">Collected</button></div></article>`
}
function itemCard(i){
  return `<div class="card item"><div class="row"><div><div class="item-title"><strong>${esc(i.name)}</strong><span class="badge ${i.active?'':'off'}">${i.active?'ACTIVE':'INACTIVE'}</span></div><div class="muted">${esc(i.brand)}</div></div>${canManage()?'<div class="actions"><button class="secondary" data-edit-item="'+i.id+'">Edit</button><button class="secondary" data-toggle-item="'+i.id+'">'+(i.active?'Deactivate':'Activate')+'</button></div>':''}</div></div>`
}
function customerCard(c,compact=false){
  const regular=c.is_regular?'<span class="badge green">REGULAR</span>':'';
  const inactive=c.active===false?'<span class="badge off">INACTIVE</span>':'';
  const cadence=c.is_regular?[c.regular_day,c.regular_frequency_weeks?(c.regular_frequency_weeks===1?'weekly':'every '+c.regular_frequency_weeks+' weeks'):null].filter(Boolean).join(' · '):'';
  return `<div class="card customer"><div class="row"><div class="customer-meta"><div class="customer-title"><strong>${esc(c.name)}</strong>${regular}${inactive}</div><div class="muted">${esc(c.phone||'No phone saved')}</div></div><div class="actions">${!compact?'<button class="secondary" data-order-customer="'+c.id+'">Order</button>':''}${canManage()?'<button class="secondary" data-edit-customer="'+c.id+'">Edit</button>':''}</div></div>${c.is_regular?'<div class="regular-box"><strong>'+esc(cadence||'Regular customer')+'</strong>'+(c.regular_notes?'<div style="margin-top:4px">'+esc(c.regular_notes)+'</div>':'')+'</div>':''}${c.notes&&!compact?'<div class="customer-notes muted">'+esc(c.notes)+'</div>':''}</div>`
}
function staffCard(s){
  if(s.record_type==='invite'){
    return `<div class="card staff-card"><div class="row"><div><div class="customer-title"><strong>${esc(s.email)}</strong><span class="badge">AWAITING SIGNUP</span></div><div class="muted">Authorised as ${esc(s.staff_role)}</div></div><button class="secondary danger" data-cancel-invite="${s.invite_id}">Cancel</button></div></div>`;
  }
  const self=s.user_id===session?.user?.id;
  return `<div class="card staff-card"><div class="row"><div><div class="customer-title"><strong>${esc(s.display_name||s.email||'Staff member')}</strong>${self?'<span class="badge green">YOU</span>':''}<span class="badge ${s.is_active?'green':'off'}">${s.is_active?'ACTIVE':'DISABLED'}</span></div><div class="muted">${esc(s.email||'No email')} · <span class="role-pill">${esc(s.staff_role)}</span></div></div>${self?'':'<button class="secondary" data-edit-staff="'+s.user_id+'">Manage</button>'}</div></div>`;
}
function isAdmin(){return profile?.role==='admin'}

function wire(){
  document.querySelectorAll('[data-ready]').forEach(b=>b.onclick=async()=>{let r=await sb.from('bread_orders_simple').update({status:'ready',updated_at:new Date().toISOString()}).eq('id',b.dataset.ready);if(r.error)return alert(r.error.message);refresh()});
  document.querySelectorAll('[data-collected]').forEach(b=>b.onclick=async()=>{let o=orders.find(x=>x.id===b.dataset.collected);let patch=o.order_type==='regular'?{status:'pending',order_date:add7(o.order_date)}:{status:'collected'};patch.updated_at=new Date().toISOString();patch.last_collected_at=new Date().toISOString();let r=await sb.from('bread_orders_simple').update(patch).eq('id',o.id);if(r.error)return alert(r.error.message);refresh()});
  document.querySelectorAll('[data-edit-item]').forEach(b=>b.onclick=()=>{let i=items.find(x=>x.id===b.dataset.editItem);if(i)openEditItem(i)});
  document.querySelectorAll('[data-toggle-item]').forEach(b=>b.onclick=async()=>{let i=items.find(x=>x.id===b.dataset.toggleItem);let r=await sb.from('bread_items').update({active:!i.active,updated_at:new Date().toISOString()}).eq('id',i.id);if(r.error)return alert(r.error.message);refresh()});
  document.querySelectorAll('[data-edit-customer]').forEach(b=>b.onclick=()=>{let c=customers.find(x=>x.id===b.dataset.editCustomer);if(c)openCustomer(c)});
  document.querySelectorAll('[data-order-customer]').forEach(b=>b.onclick=()=>openNew(b.dataset.orderCustomer));
  document.querySelectorAll('[data-edit-staff]').forEach(b=>b.onclick=()=>{const s=staffAccess.find(x=>x.user_id===b.dataset.editStaff);if(s)openStaffEdit(s)});
  document.querySelectorAll('[data-cancel-invite]').forEach(b=>b.onclick=async()=>{if(!confirm('Cancel this email authorisation?'))return;const r=await sb.rpc('cancel_staff_invite',{p_invite_id:b.dataset.cancelInvite});if(r.error)return alert(r.error.message);refresh()});
  const manageItems=$('manageItems');if(manageItems)manageItems.onclick=()=>{route='items';render()};
  const manageCustomers=$('manageCustomers');if(manageCustomers)manageCustomers.onclick=()=>{route='customers';render()};
  const invite=$('inviteStaff');if(invite)invite.onclick=openStaffInvite;
  const copy=$('copyAppLink');if(copy)copy.onclick=async()=>{const link='https://happy-olive-tree-bread-orders.netlify.app';try{await navigator.clipboard.writeText(link);alert('App link copied.')}catch(e){alert(link)}};
  const search=$('customerSearch');if(search)search.oninput=e=>{customerSearch=e.target.value;renderCustomersOnly()};
}
function renderCustomersOnly(){
  if(route!=='customers')return;
  const q=customerSearch.trim().toLowerCase();
  const list=activeCustomers().filter(c=>!q||[c.name,c.phone,c.notes,c.regular_notes].some(v=>String(v||'').toLowerCase().includes(q)));
  $('customerList').innerHTML=list.map(c=>customerCard(c)).join('')||'<div class="card muted empty">No customers match that search.</div>';
  wire();
  const search=$('customerSearch');if(search){search.value=customerSearch;search.focus();search.setSelectionRange(search.value.length,search.value.length)}
}
function render(){
  document.querySelectorAll('[data-route]').forEach(b=>b.classList.toggle('active',b.dataset.route===route));
  const list=activeOrders();
  $('fab').classList.toggle('hidden',route==='staff'||((route==='items'||route==='customers')&&!canManage()));
  if(route==='today'){
    let today=list.filter(o=>o.order_date===d()),over=list.filter(o=>o.order_date<d()),tom=list.filter(o=>o.order_date===d(1));
    $('title').textContent='Today';
    $('view').innerHTML=`<div class="hero"><h2>Today</h2><div class="metrics"><div class="metric"><strong>${today.length}</strong>Today</div><div class="metric"><strong>${over.length}</strong>Overdue</div><div class="metric"><strong>${tom.length}</strong>Tomorrow</div></div><div class="quick"><button id="manageCustomers" class="secondary">Customers · ${activeCustomers().length}</button><button id="manageItems" class="secondary">Items · ${activeItems().length}</button></div></div><div class="section"><h2>Orders</h2><span class="muted">${today.length}</span></div><div class="stack">${today.map(orderCard).join('')||'<div class="card muted empty">No orders today.</div>'}</div>`;
  }else if(route==='upcoming'){
    let x=list.filter(o=>o.order_date>d()).sort((a,b)=>a.order_date.localeCompare(b.order_date));
    $('title').textContent='Upcoming';$('view').innerHTML='<div class="stack">'+(x.map(orderCard).join('')||'<div class="card muted empty">No upcoming orders.</div>')+'</div>';
  }else if(route==='regular'){
    let x=activeCustomers().filter(c=>c.is_regular);
    $('title').textContent='Regular';
    $('view').innerHTML=`<div class="hero"><h2>Regular customers</h2><p style="margin-top:6px;opacity:.8">Patterns identified from the order book. Use Order to prefill a new order.</p><div class="metrics"><div class="metric"><strong>${x.length}</strong>Regular</div><div class="metric"><strong>${x.filter(c=>c.regular_day).length}</strong>Scheduled</div><div class="metric"><strong>${x.filter(c=>c.phone).length}</strong>With phone</div></div></div><div class="stack">${x.map(c=>customerCard(c,false)).join('')||'<div class="card muted empty">No regular customers yet.</div>'}</div>`;
  }else if(route==='customers'){
    $('title').textContent='Customers';
    const regularCount=activeCustomers().filter(c=>c.is_regular).length, phoneCount=activeCustomers().filter(c=>c.phone).length;
    $('view').innerHTML=`<div class="hero"><h2>Customer book</h2><p style="margin-top:6px;opacity:.8">Names, phone numbers and recurring order patterns.</p><div class="metrics"><div class="metric"><strong>${activeCustomers().length}</strong>Customers</div><div class="metric"><strong>${regularCount}</strong>Regular</div><div class="metric"><strong>${phoneCount}</strong>With phone</div></div></div><input id="customerSearch" class="search" placeholder="Search name, phone or notes" value="${esc(customerSearch)}"><div id="customerList" class="stack"></div>`;
    renderCustomersOnly();return;
  }else if(route==='items'){
    $('title').textContent='Items';const activeCount=activeItems().length;
    const grouped=brands().map(brand=>`<section class="brand-group"><div class="brand-head"><h3>${esc(brand)}</h3><span class="muted">${itemsForBrand(brand).length} item${itemsForBrand(brand).length===1?'':'s'}</span></div><div class="stack">${itemsForBrand(brand).map(itemCard).join('')}</div></section>`).join('');
    $('view').innerHTML=`<div class="hero"><h2>Item catalogue</h2><p style="margin-top:6px;opacity:.8">Breads are grouped by brand for quicker browsing.</p><div class="metrics"><div class="metric"><strong>${items.length}</strong>Total</div><div class="metric"><strong>${activeCount}</strong>Active</div><div class="metric"><strong>${brands().length}</strong>Brands</div></div></div><div class="section"><h2>Saved items</h2><span class="muted">${canManage()?'Tap + to add':'View only'}</span></div>${grouped||'<div class="card muted empty">No items yet. Tap + to add your first one.</div>'}`;
  }else if(route==='staff'&&isAdmin()){
    $('title').textContent='Staff Access';
    const users=staffAccess.filter(s=>s.record_type==='user');
    const invites=staffAccess.filter(s=>s.record_type==='invite');
    $('view').innerHTML=`<div class="hero"><h2>Staff access</h2><p class="access-help" style="margin-top:6px;opacity:.86">Authorise an email, then send that person the app link. They create an account using the same email.</p><div class="metrics"><div class="metric"><strong>${users.filter(s=>s.is_active).length}</strong>Active</div><div class="metric"><strong>${invites.length}</strong>Awaiting</div><div class="metric"><strong>${users.filter(s=>s.staff_role==='admin'&&s.is_active).length}</strong>Admins</div></div><div class="quick"><button id="inviteStaff" class="secondary">+ Authorise email</button><button id="copyAppLink" class="secondary">Copy app link</button></div></div><div class="notice"><strong>Roles:</strong> Staff can take and update orders. Managers can also manage customers and items. Admins can additionally manage staff access.</div><div class="section"><h2>Current staff</h2><span class="muted">${users.length}</span></div><div class="stack">${users.map(staffCard).join('')||'<div class="card muted empty">No staff accounts.</div>'}</div><div class="section"><h2>Awaiting signup</h2><span class="muted">${invites.length}</span></div><div class="stack">${invites.map(staffCard).join('')||'<div class="card muted empty">No pending email authorisations.</div>'}</div>`;
  }else{
    route='today';render();return;
  }
  wire();
}
function openNew(prefillCustomerId=null){
  const choices=activeItems();if(!choices.length){if(canManage()){route='items';render();alert('Add at least one active item first.')}else alert('No active items are available yet.');return}
  let type='one_time';const brandOptions=brands(true).map(b=>'<option value="'+esc(b)+'">'+esc(b)+'</option>').join('');
  const customerOptions=activeCustomers().map(c=>'<option value="'+c.id+'">'+esc(c.name)+(c.phone?' · '+esc(c.phone):'')+'</option>').join('');
  $('modal').classList.remove('hidden');
  $('modal').innerHTML=`<div class="sheet"><div class="row"><h2>New bread order</h2><button id="close" class="secondary">Close</button></div><form id="orderForm" class="form" style="margin-top:14px"><label class="field-label" for="customerSelect">Customer</label><select id="customerSelect"><option value="">New / one-off customer</option>${customerOptions}</select><input id="name" placeholder="Customer name" required><input id="phone" placeholder="Phone number"><label class="field-label" for="brandSelect">Brand</label><select id="brandSelect" required><option value="">Select brand</option>${brandOptions}</select><label class="field-label" for="itemSelect">Bread</label><select id="itemSelect" required disabled><option value="">Select a brand first</option></select><div class="two"><input id="qty" type="number" min="1" value="1" required><input id="date" type="date" value="${d(1)}" required></div><div class="seg"><button type="button" id="one" class="secondary active">One-time</button><button type="button" id="reg" class="secondary">Regular weekly</button></div><button class="primary">Add order</button></form></div>`;
  $('close').onclick=()=>$('modal').classList.add('hidden');
  function fillCustomer(id){let c=customers.find(x=>x.id===id);if(c){$('name').value=c.name;$('phone').value=c.phone||''}}
  $('customerSelect').onchange=()=>fillCustomer($('customerSelect').value);
  if(prefillCustomerId){$('customerSelect').value=prefillCustomerId;fillCustomer(prefillCustomerId)}
  $('brandSelect').onchange=()=>{const brand=$('brandSelect').value,bread=$('itemSelect');if(!brand){bread.innerHTML='<option value="">Select a brand first</option>';bread.disabled=true;return}const filtered=itemsForBrand(brand,true);bread.innerHTML='<option value="">Select bread</option>'+filtered.map(i=>'<option value="'+i.id+'">'+esc(i.name)+'</option>').join('');bread.disabled=false};
  $('one').onclick=()=>{type='one_time';$('one').classList.add('active');$('reg').classList.remove('active')};$('reg').onclick=()=>{type='regular';$('reg').classList.add('active');$('one').classList.remove('active')};
  $('orderForm').onsubmit=async e=>{
    e.preventDefault();const item=items.find(i=>i.id===$('itemSelect').value);if(!item)return alert('Please select a bread.');
    let selectedId=$('customerSelect').value||null,name=$('name').value.trim(),phone=$('phone').value.trim()||null;
    if(!selectedId){
      const existing=customers.find(c=>c.name.toLowerCase()===name.toLowerCase());
      if(existing)selectedId=existing.id;
      else{
        const cr=await sb.from('customers').insert({store_id:storeId,name,phone,active:true,last_used_at:new Date().toISOString(),updated_at:new Date().toISOString()}).select().single();
        if(cr.error)return alert(cr.error.message);selectedId=cr.data.id;
      }
    }else{
      const cr=await sb.from('customers').update({phone:phone||undefined,last_used_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('id',selectedId);
      if(cr.error)return alert(cr.error.message);
    }
    let payload={store_id:storeId,customer_name:name,phone,brand:item.brand,bread_type:item.name,quantity:Number($('qty').value),order_date:$('date').value,order_type:type,status:'pending',created_by:session.user.id,updated_at:new Date().toISOString()};
    let r=await sb.from('bread_orders_simple').insert(payload);if(r.error)return alert(r.error.message);$('modal').classList.add('hidden');refresh();
  };
}
function openCustomer(c=null){
  if(!canManage())return;const editing=!!c;const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  $('modal').classList.remove('hidden');
  $('modal').innerHTML=`<div class="sheet"><div class="row"><h2>${editing?'Edit customer':'Add customer'}</h2><button id="close" class="secondary">Close</button></div><form id="customerForm" class="form" style="margin-top:14px"><input id="custName" placeholder="Customer name" value="${esc(c?.name||'')}" required><input id="custPhone" placeholder="Phone number" value="${esc(c?.phone||'')}"><textarea id="custNotes" placeholder="General notes">${esc(c?.notes||'')}</textarea><label class="checkrow"><input id="custRegular" type="checkbox" ${c?.is_regular?'checked':''}> Regular customer</label><div id="regularFields" class="${c?.is_regular?'':'hidden'} form"><div class="two"><select id="custDay"><option value="">Day varies</option>${days.map(x=>'<option value="'+x+'" '+(c?.regular_day===x?'selected':'')+'>'+x+'</option>').join('')}</select><select id="custFreq"><option value="">Frequency varies</option><option value="1" ${c?.regular_frequency_weeks===1?'selected':''}>Weekly</option><option value="2" ${c?.regular_frequency_weeks===2?'selected':''}>Fortnightly</option><option value="4" ${c?.regular_frequency_weeks===4?'selected':''}>Every 4 weeks</option></select></div><textarea id="custRegularNotes" placeholder="Typical regular order">${esc(c?.regular_notes||'')}</textarea></div><label class="checkrow"><input id="custActive" type="checkbox" ${c?.active===false?'':'checked'}> Active customer</label><button class="primary">${editing?'Save changes':'Add customer'}</button></form></div>`;
  $('close').onclick=()=>$('modal').classList.add('hidden');$('custRegular').onchange=()=>$('regularFields').classList.toggle('hidden',!$('custRegular').checked);
  $('customerForm').onsubmit=async e=>{
    e.preventDefault();const regular=$('custRegular').checked;
    const payload={store_id:storeId,name:$('custName').value.trim(),phone:$('custPhone').value.trim()||null,notes:$('custNotes').value.trim()||null,active:$('custActive').checked,is_regular:regular,regular_day:regular?($('custDay').value||null):null,regular_frequency_weeks:regular&&$('custFreq').value?Number($('custFreq').value):null,regular_notes:regular?($('custRegularNotes').value.trim()||null):null,updated_at:new Date().toISOString()};
    const r=editing?await sb.from('customers').update(payload).eq('id',c.id):await sb.from('customers').insert(payload);
    if(r.error)return alert(r.error.message);$('modal').classList.add('hidden');refresh();
  };
}
function openStaffInvite(){
  if(!isAdmin())return;
  $('modal').classList.remove('hidden');
  $('modal').innerHTML=`<div class="sheet"><div class="row"><h2>Authorise staff email</h2><button id="close" class="secondary">Close</button></div><div class="notice" style="margin-top:12px">This authorises the email; it does not send an email automatically. Send them the app link after saving.</div><form id="staffInviteForm" class="form" style="margin-top:14px"><label class="field-label">Email</label><input id="staffEmail" type="email" placeholder="employee@example.com" required><label class="field-label">Role</label><select id="staffRole"><option value="staff">Staff</option><option value="manager">Manager</option><option value="admin">Admin</option></select><button class="primary">Authorise email</button></form></div>`;
  $('close').onclick=()=>$('modal').classList.add('hidden');
  $('staffInviteForm').onsubmit=async e=>{
    e.preventDefault();
    const r=await sb.rpc('create_staff_invite',{p_email:$('staffEmail').value.trim(),p_role:$('staffRole').value});
    if(r.error)return alert(r.error.message);
    $('modal').classList.add('hidden');
    await refresh();
    alert('Email authorised. Send them the app link and ask them to create an account with this exact email.');
  };
}
function openStaffEdit(s){
  if(!isAdmin()||!s||s.record_type!=='user')return;
  $('modal').classList.remove('hidden');
  $('modal').innerHTML=`<div class="sheet"><div class="row"><h2>Manage staff</h2><button id="close" class="secondary">Close</button></div><div class="card" style="margin-top:14px"><strong>${esc(s.display_name||s.email||'Staff member')}</strong><div class="muted">${esc(s.email||'')}</div></div><form id="staffEditForm" class="form" style="margin-top:12px"><label class="field-label">Role</label><select id="editStaffRole"><option value="staff" ${s.staff_role==='staff'?'selected':''}>Staff</option><option value="manager" ${s.staff_role==='manager'?'selected':''}>Manager</option><option value="admin" ${s.staff_role==='admin'?'selected':''}>Admin</option></select><label class="checkrow"><input id="editStaffActive" type="checkbox" ${s.is_active?'checked':''}> Active access</label><button class="primary">Save access</button></form></div>`;
  $('close').onclick=()=>$('modal').classList.add('hidden');
  $('staffEditForm').onsubmit=async e=>{
    e.preventDefault();
    const r=await sb.rpc('update_staff_access',{p_user_id:s.user_id,p_role:$('editStaffRole').value,p_active:$('editStaffActive').checked});
    if(r.error)return alert(r.error.message);
    $('modal').classList.add('hidden');refresh();
  };
}
function openItem(){
  if(!canManage())return;const options=brands().map(b=>'<option value="'+esc(b)+'">'+esc(b)+'</option>').join('');
  $('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="sheet"><div class="row"><h2>Add item</h2><button id="close" class="secondary">Close</button></div><form id="itemForm" class="form" style="margin-top:14px"><label class="field-label" for="brandChoice">Brand</label><select id="brandChoice" required><option value="">Select brand</option>${options}<option value="__new__">+ Add new brand…</option></select><input id="newBrand" class="hidden" placeholder="New brand name"><label class="field-label" for="itemName">Bread</label><input id="itemName" placeholder="e.g. Wholemeal Bread" required><button class="primary">Save item</button></form></div>`;
  $('close').onclick=()=>$('modal').classList.add('hidden');$('brandChoice').onchange=()=>{const n=$('brandChoice').value==='__new__';$('newBrand').classList.toggle('hidden',!n);$('newBrand').required=n};
  $('itemForm').onsubmit=async e=>{e.preventDefault();const brand=$('brandChoice').value==='__new__'?$('newBrand').value.trim():$('brandChoice').value;if(!brand)return alert('Please select or add a brand.');const payload={store_id:storeId,brand,name:$('itemName').value.trim(),active:true,created_by:session.user.id,updated_at:new Date().toISOString()};let r=await sb.from('bread_items').insert(payload);if(r.error){if(r.error.code==='23505')return alert('That item already exists.');return alert(r.error.message)}$('modal').classList.add('hidden');refresh()};
}
function openEditItem(item){
  if(!canManage()||!item)return;const options=brands().map(b=>'<option value="'+esc(b)+'" '+(b===item.brand?'selected':'')+'>'+esc(b)+'</option>').join('');
  $('modal').classList.remove('hidden');$('modal').innerHTML=`<div class="sheet"><div class="row"><h2>Edit item</h2><button id="close" class="secondary">Close</button></div><form id="editItemForm" class="form" style="margin-top:14px"><label class="field-label">Brand</label><select id="editBrandChoice" required>${options}<option value="__new__">+ Add new brand…</option></select><input id="editNewBrand" class="hidden" placeholder="New brand name"><label class="field-label">Bread</label><input id="editItemName" value="${esc(item.name)}" required><button class="primary">Save changes</button></form></div>`;
  $('close').onclick=()=>$('modal').classList.add('hidden');$('editBrandChoice').onchange=()=>{const n=$('editBrandChoice').value==='__new__';$('editNewBrand').classList.toggle('hidden',!n);$('editNewBrand').required=n};
  $('editItemForm').onsubmit=async e=>{e.preventDefault();const brand=$('editBrandChoice').value==='__new__'?$('editNewBrand').value.trim():$('editBrandChoice').value,name=$('editItemName').value.trim();if(!brand||!name)return alert('Brand and bread name are required.');let r=await sb.from('bread_items').update({brand,name,updated_at:new Date().toISOString()}).eq('id',item.id);if(r.error){if(r.error.code==='23505')return alert('An item with that brand and bread name already exists.');return alert(r.error.message)}$('modal').classList.add('hidden');refresh()};
}
let authMode='signin';
function setAuthMode(mode){authMode=mode;const create=mode==='signup';$('displayName').classList.toggle('hidden',!create);$('displayName').required=create;$('authSubmit').textContent=create?'Create account':'Sign in';$('authToggle').textContent=create?'Back to sign in':'Create account';$('authHelp').textContent=create?'Create an account with an email authorised by the store admin.':'Sign in with your staff account.';$('authErr').textContent='';$('resendConfirm').classList.add('hidden')}
$('authToggle').onclick=()=>setAuthMode(authMode==='signin'?'signup':'signin');
$('resendConfirm').onclick=async()=>{const email=$('email').value.trim();if(!email)return $('authErr').textContent='Enter the email address first.';$('resendConfirm').disabled=true;const r=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:'https://happy-olive-tree-bread-orders.netlify.app'}});$('resendConfirm').disabled=false;if(r.error)return $('authErr').textContent=r.error.message;$('authErr').textContent='Confirmation email sent again. Check the inbox and spam folder.';};
$('authForm').onsubmit=async e=>{e.preventDefault();$('authErr').textContent='';$('resendConfirm').classList.add('hidden');if(authMode==='signup'){let r=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:'https://happy-olive-tree-bread-orders.netlify.app',data:{display_name:$('displayName').value.trim()||$('email').value.split('@')[0]}}});if(r.error)return $('authErr').textContent=r.error.message;session=r.data.session;if(!session){setAuthMode('signin');$('authErr').textContent='Account created. Please confirm the email, then sign in.';return}await enter();return}let r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('authErr').textContent=r.error.message;if(String(r.error.message).toLowerCase().includes('email not confirmed'))$('resendConfirm').classList.remove('hidden');return}session=r.data.session;await enter()};
async function enter(){let p=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(p.error)return $('authErr').textContent=p.error.message;if(!p.data){let a=await sb.rpc('accept_staff_invite');if(!a.error)p=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(!p.data){let boot=await sb.rpc('bootstrap_first_admin',{p_display_name:session.user.user_metadata?.display_name||(session.user.email||'Admin').split('@')[0]});if(!boot.error)p=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle()}if(!p.data){$('authErr').textContent='Access unavailable. Your email has not been authorised by the store owner.';await sb.auth.signOut();return}}profile=p.data;storeId=profile.store_id;$('staffNav').classList.toggle('hidden',profile.role!=='admin');$('roleChip').textContent=profile.role;$('auth').classList.add('hidden');$('app').classList.remove('hidden');refresh()}
$('signout').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('fab').onclick=()=>route==='items'?openItem():route==='customers'?openCustomer():openNew();
document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{route=b.dataset.route;customerSearch='';render()});
(async()=>{let s=await sb.auth.getSession();session=s.data.session;if(session)enter()})();
</script>
</body>
